services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LOCAL_MODE: "0"
      HOST: 0.0.0.0
      PORT: "4180"
      DATA_DIR: /data
    volumes:
      - account-data:/data
  https:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      - app
volumes:
  account-data:
  caddy-data:
