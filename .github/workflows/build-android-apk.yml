name: Build GDQPAN Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Sync Capacitor Android
        run: |
          chmod +x mobile/android/gradlew
          cd mobile
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/GDQPAN.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDQPAN-Android-APK
          path: mobile/GDQPAN.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: mobile-latest
          name: "GDQPAN Mobile App (Android APK)"
          body: |
            ## 📱 Ứng Dụng GDQPAN Mobile – Hệ Thống Thông Báo Tự Động
            * **Phiên bản**: 1.0.0 (Capacitor Native)
            * **Hệ điều hành**: Android 8.0+
            
            ### 📥 Hướng dẫn cài đặt cho khách hàng:
            1. Tải file `GDQPAN.apk` bên dưới về điện thoại.
            2. Nhấn vào file vừa tải và chọn **Cài đặt**.
            3. Mở ứng dụng và cho phép quyền Thông báo để app tự động đổ chuông theo lịch.
          files: mobile/GDQPAN.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
