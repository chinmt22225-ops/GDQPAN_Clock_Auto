name: Build GDQPAN Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install

      - name: Run Startup Verification Tests
        working-directory: mobile
        run: |
          npm run build
          npm run test:apk
          npm test

      - name: Sync Capacitor Android
        working-directory: mobile
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/GDQPAN.apk

      - name: Verify Distributable APK
        working-directory: mobile
        run: |
          node verify-apk.cjs --apk GDQPAN.apk --version "$(node -p 'require("./package.json").version')" --code 19 --require-v1 --output GDQPAN.apk.verification.json
          sha256sum GDQPAN.apk > GDQPAN.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDQPAN-Android-APK
          path: |
            mobile/GDQPAN.apk
            mobile/GDQPAN.apk.sha256
            mobile/GDQPAN.apk.verification.json
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: mobile-latest
          name: "GDQPAN Mobile App (Android APK)"
          body: |
            ## 📱 Ứng Dụng GDQPAN Mobile – Hệ Thống Thông Báo Tự Động
            * **Phiên bản**: 1.4.12 – tự phát toàn bài sau 5 giây; chạm ô giờ/phút/giây để hủy đếm ngược và nhập hẹn giờ
            * **Hệ điều hành**: Android 7.0+ (API 24)
            
            ### 📥 Hướng dẫn cài đặt cho khách hàng:
            1. Tải file `GDQPAN.apk` bên dưới về điện thoại.
            2. Đợi tải xong toàn bộ tệp. Đối chiếu dung lượng và SHA-256 trong `GDQPAN.apk.verification.json` nếu gặp lỗi phân tích gói.
            3. Nhấn vào file vừa tải và chọn **Cài đặt**. Cài đè để giữ dữ liệu.
            4. Mở ứng dụng, vào Tiện ích và cấp quyền Thông báo / Báo thức chính xác / Màn hình báo thức để tự phát lịch khi khóa màn hình.
          files: |
            mobile/GDQPAN.apk
            mobile/GDQPAN.apk.sha256
            mobile/GDQPAN.apk.verification.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
